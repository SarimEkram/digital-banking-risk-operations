# --- Postgres
# Values come from environment variables when running in
# and fall back to localhost defaults for local development.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/banking}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:banking}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:banking}

# --- Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JPA: schema controlled by Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

spring.data.redis.repositories.enabled=false

# --- JWT
app.jwt.issuer=${APP_JWT_ISSUER:dbrisk}
app.jwt.expiration-seconds=${APP_JWT_EXPIRATION_SECONDS:3600}
app.jwt.secret=${APP_JWT_SECRET:change-me-to-a-long-random-string-at-least-32-chars}