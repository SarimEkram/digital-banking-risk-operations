# Full-stack, one-command run: database + cache + backend + frontend.
# Dev/demo configuration — secrets below are intentionally simple so the
# project runs with a single `docker compose up`. Do not use as-is in production.

services:
  db:
    image: postgres:16-alpine
    container_name: dbrisk_db
    environment:
      POSTGRES_DB: banking
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking
    volumes:
      - dbrisk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking -d banking"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dbrisk_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - dbrisk_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dbrisk_backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/banking
      SPRING_DATASOURCE_USERNAME: banking
      SPRING_DATASOURCE_PASSWORD: banking
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_JWT_ISSUER: dbrisk
      APP_JWT_EXPIRATION_SECONDS: 3600
      APP_JWT_SECRET: dev-only-secret-change-me-at-least-32-chars-long-xyz
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dbrisk_frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  dbrisk_pgdata:
  dbrisk_redisdata: